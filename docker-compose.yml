version: '3.4'
services:
  prometheus.avado.dappnode.eth:
    build: ./build
    image: 'prometheus.avado.dappnode.eth:0.0.2'
    restart: always
    environment:
      - RETENTION_DAYS=30
      - RETENTION_SIZE=10GB
    volumes:
      - 'data:/prometheus/'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
volumes:
  data: {}
